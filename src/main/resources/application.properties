spring.application.name=gtfs-monitor
server.port=8080

gtfs.static-props.url=https://romamobilita.it/sites/default/files/rome_static_gtfs.zip
gtfs.static-props.refresh-millis=3600000

gtfs.realtime.trip-updates-url=https://romamobilita.it/sites/default/files/rome_rtgtfs_trip_updates_feed.pb
gtfs.realtime.vehicle-positions-url=https://romamobilita.it/sites/default/files/rome_rtgtfs_vehicle_positions_feed.pb
gtfs.realtime.service-alerts-url=https://romamobilita.it/sites/default/files/rome_rtgtfs_service_alerts_feed.pb
gtfs.realtime.refresh-millis=5000

spring.codec.max-in-memory-size=104857600

server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/event-stream
server.compression.min-response-size=1024

# OpenTripPlanner
journey.otp.enabled=true
journey.otp.plan-path=/routers/default/plan
journey.otp.timeout-seconds=15

# OTP routing preferences (tuned for Rome transit users)
journey.otp.search-window=PT90M
journey.otp.search-window-fallback=PT180M
journey.otp.max-itineraries=20
journey.otp.max-upstream-itineraries=40
journey.otp.walk-speed=1.34
journey.otp.walk-reluctance=1.6
journey.otp.wait-reluctance=1.0
journey.otp.transfer-penalty=300
journey.otp.board-slack-seconds=60
journey.otp.alight-slack-seconds=30
journey.otp.stairs-reluctance=1.8

# Visibilita' opzione treno: garantisce che la migliore opzione RAIL compaia tra i primi
# risultati (slot 0-based, senza scalzare la #0) se competitiva entro la soglia di ritardo.
journey.otp.rail-visibility-slot=2
journey.otp.rail-visibility-max-delay-minutes=45

# Workaround: inietta un'opzione treno (cammino->treno->cammino) quando il piano non ne ha
# ma partenza e arrivo sono entrambi vicini a una stazione. Mettere a false per disattivarlo.
journey.otp.rail-injection-enabled=true
journey.otp.rail-injection-max-station-meters=1200

# Rail live info
rail.viaggiatreno.enabled=true
rail.viaggiatreno.base-url=https://www.viaggiatreno.it
rail.viaggiatreno.api-base-url=http://www.viaggiatreno.it

# ===== Push notifications (FCM) =====
# Per attivare le push: 1) generare service account JSON dalla Firebase Console
# 2) puntare fcm.credentials-path al file (oppure GOOGLE_APPLICATION_CREDENTIALS).
# Senza credenziali il dispatcher e' no-op: backend gira lo stesso, solo non spedisce nulla.
fcm.enabled=true
fcm.credentials-path=${FCM_CREDENTIALS_PATH:}
fcm.topic-alerts=wemoveroma-alerts
fcm.topic-strikes=wemoveroma-strikes

# Filtro severity: solo SEVERE + WARNING vanno in push. Aggiungere INFO per allargare.
notifications.alerts.severities=SEVERE,WARNING
# Backstop anti-flood: massimo N push per ciclo di refresh (5s default).
notifications.alerts.max-per-refresh=5
# File JSON che persiste gli alert id gia' notificati (anti-spam su restart).
notifications.state-file=${user.home}/.wemoveroma/alerts-last-seen.json

# ===== Scioperi MIT =====
strikes.mit.rss-url=https://scioperi.mit.gov.it/mit2/public/scioperi/rss
# Settori che ci interessano (match case-insensitive contains nel campo "Settore").
strikes.sectors=Trasporto Pubblico Locale,Ferroviario,Appalti ferroviari,Trasporto ferroviario
# Regioni rilevanti: Italia = scioperi nazionali; Lazio = locali.
strikes.regions=Italia,Lazio
# Al primo refresh dopo l'avvio, NON dispatchare: popola solo il tracker (anti-spam).
strikes.dispatch-on-startup=false
notifications.strikes.state-file=${user.home}/.wemoveroma/strikes-last-seen.json
