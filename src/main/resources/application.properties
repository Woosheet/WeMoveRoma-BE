spring.application.name=gtfs-monitor
server.port=8080

# Scheduler: pool condiviso per i job @Scheduled (3 poll GTFS-RT a 5s, cron statici, scioperi).
# Senza pool esplicito Spring usa UN solo thread: un job lento bloccherebbe tutti gli altri.
spring.task.scheduling.pool.size=6

# Roma Mobilita' ha spostato i file da Drupal a WordPress: i vecchi indirizzi
# /sites/default/files/ rispondono 301 verso questi. Puntare gia' alla
# destinazione toglie un giro di rete a ogni poll (due feed ogni 5 secondi) e
# una valutazione in meno al filtro anti-bot che ogni tanto risponde 403.
gtfs.static-props.url=https://romamobilita.it/wp-content/uploads/shared/rome_static_gtfs.zip
gtfs.static-props.refresh-millis=3600000

gtfs.realtime.trip-updates-url=https://romamobilita.it/wp-content/uploads/shared/rome_rtgtfs_trip_updates_feed.pb
gtfs.realtime.vehicle-positions-url=https://romamobilita.it/wp-content/uploads/shared/rome_rtgtfs_vehicle_positions_feed.pb
gtfs.realtime.service-alerts-url=https://romamobilita.it/wp-content/uploads/shared/rome_rtgtfs_service_alerts_feed.pb
gtfs.realtime.refresh-millis=5000

# Warm-up degli indici per-data (orari programmati + corse attive) a fine rebuild.
# Senza, il primo utente dopo ogni ricostruzione paga la scansione di stop_times.txt
# sul proprio thread: misurati 2,8 s su /nearby e 5,2 s su /vehicles?linea=X.
gtfs.index.warmup.enabled=true
# Giorni da scaldare a partire da oggi. 2 = oggi + domani (domani serve davvero:
# /vehicles?linea=X e gli arrivi a cavallo della mezzanotte lo interrogano da soli).
# Ogni giorno in piu' costa una scansione del feed e qualche decina di MB di heap.
gtfs.index.warmup.days=2

spring.codec.max-in-memory-size=104857600

server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/event-stream
server.compression.min-response-size=1024

# OpenTripPlanner
journey.otp.enabled=true
journey.otp.plan-path=/routers/default/plan
journey.otp.timeout-seconds=15

# OTP routing preferences (tuned for Rome transit users)
journey.otp.search-window=PT90M
journey.otp.search-window-fallback=PT180M
journey.otp.max-itineraries=20
journey.otp.max-upstream-itineraries=40
journey.otp.walk-speed=1.34
journey.otp.walk-reluctance=1.6
journey.otp.wait-reluctance=1.0
journey.otp.transfer-penalty=300
journey.otp.board-slack-seconds=60
journey.otp.alight-slack-seconds=30
journey.otp.stairs-reluctance=1.8

# Visibilita' opzione treno: garantisce che la migliore opzione RAIL compaia tra i primi
# risultati (slot 0-based, senza scalzare la #0) se competitiva entro la soglia di ritardo.
journey.otp.rail-visibility-slot=2
journey.otp.rail-visibility-max-delay-minutes=45

# Workaround: inietta un'opzione treno (cammino->treno->cammino) quando il piano non ne ha
# ma partenza e arrivo sono entrambi vicini a una stazione. Mettere a false per disattivarlo.
journey.otp.rail-injection-enabled=true
journey.otp.rail-injection-max-station-meters=1200

# Rail live info
rail.viaggiatreno.enabled=true
rail.viaggiatreno.base-url=https://www.viaggiatreno.it
rail.viaggiatreno.api-base-url=http://www.viaggiatreno.it

# ===== Push notifications (FCM) =====
# Per attivare le push: 1) generare service account JSON dalla Firebase Console
# 2) puntare fcm.credentials-path al file (oppure GOOGLE_APPLICATION_CREDENTIALS).
# Senza credenziali il dispatcher e' no-op: backend gira lo stesso, solo non spedisce nulla.
fcm.enabled=true
fcm.credentials-path=${FCM_CREDENTIALS_PATH:}
fcm.topic-alerts=wemoveroma-alerts
fcm.topic-strikes=wemoveroma-strikes

# Filtro severity applicato alla severita' EFFETTIVA (feed se c'e', altrimenti derivata
# dall'effetto: vedi AlertSeverityResolver). Solo SEVERE = servizio sospeso o fermate non
# servite. Aggiungere WARNING qui significa notificare a tutti ogni deviazione per lavori:
# il 18/09/2026 erano 113 avvisi su 116.
notifications.alerts.severities=SEVERE
# Un avviso che tocca almeno N linee passa comunque: riguarda la rete, non un percorso solo.
# 0 disattiva la regola.
notifications.alerts.min-routes-for-push=5
# Backstop anti-flood: massimo N push per ciclo di refresh (5s default).
notifications.alerts.max-per-refresh=5
# File JSON che persiste gli alert id gia' notificati (anti-spam su restart).
notifications.state-file=${user.home}/.wemoveroma/alerts-last-seen.json

# ===== Scioperi MIT =====
strikes.mit.rss-url=https://scioperi.mit.gov.it/mit2/public/scioperi/rss
# Settori del registro che riguardano chi si muove a Roma (match case-insensitive
# contains nel campo "Settore"). Il registro ne usa una decina: aereo, marittimo,
# elicotteri, merci non fermano un bus.
# "Generale" e "Plurisettoriale" ci sono perche' sono gli scioperi che fermano la
# citta' davvero: senza, il 18/09/2026 mancavano dall'elenco lo sciopero
# plurisettoriale del 2 ottobre e quello generale del 30.
# "Appalti ferroviari" resta fuori: sono ditte in appalto (pulizie, ristorazione,
# portierato) che non fermano le corse.
strikes.sectors=Trasporto Pubblico Locale,Trasporto ferroviario,Ferroviario,Generale,Plurisettoriale
# Regioni rilevanti: Italia = scioperi nazionali; Lazio = locali. Passa comunque
# tutto cio' che il Ministero dichiara di rilevanza Nazionale, qualunque regione
# risulti scritta accanto (capita: generale nazionale con Regione = Toscana).
strikes.regions=Italia,Lazio
# Al primo refresh dopo l'avvio, NON dispatchare: popola solo il tracker (anti-spam).
strikes.dispatch-on-startup=false
notifications.strikes.state-file=${user.home}/.wemoveroma/strikes-last-seen.json

# ===== Storico su Postgres (PunctualityService) =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/wemoveroma}
spring.datasource.username=${DB_USERNAME:wemoveroma}
spring.datasource.password=${DB_PASSWORD:}
# Il backend parte anche con il database spento: mappa e arrivi non dipendono dallo
# storico. Due secondi al massimo per una connessione, e il thread dello storico
# non tiene ferme le altre richieste.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.maximum-pool-size=4
# La migrazione la lancia PunctualityService quando il database risponde: con Spring
# all'avvio, un Postgres spento impedirebbe al backend di partire.
spring.flyway.enabled=false
# Per lo stesso motivo lo stato del database non entra in /actuator/health.
management.health.db.enabled=false
# false spegne raccolta e scritture (l'endpoint della puntualita' risponde 503).
punctuality.enabled=${PUNCTUALITY_ENABLED:true}
