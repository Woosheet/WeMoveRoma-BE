# Profilo attivo solo nei test (@ActiveProfiles("test")).
#
# I file application-<profilo>.properties si SOVRAPPONGONO ad application.properties
# invece di sostituirlo: qui stanno solo gli override che servono a rendere il
# contesto di test deterministico, offline e senza effetti sul disco di chi lo esegue.
# (Un src/test/resources/application.properties invece avrebbe MASCHERATO quello di
# main — sul classpath vince la prima risorsa con quel nome, e target/test-classes
# precede target/classes — facendo sparire tutta la configurazione dell'app.)

# gtfs.static-props.data-dir non ha un default in application.properties, ed e' voluto:
# e' un parametro obbligatorio e StaticGtfsUpdater fallisce apposta se manca. Senza
# profilo attivo pero' i test non lo trovavano affatto e GtfsIndexService.init()
# esplodeva su Path.of(null). Qui punta a una cartella usa-e-getta sotto target/.
gtfs.static-props.data-dir=target/test-data/gtfs_static

# StaticGtfsUpdater scarica il feed su ApplicationReadyEvent (che scatta anche sotto
# @SpringBootTest) e ne fa lo swap atomico dentro data-dir: con gli URL di produzione
# un semplice contextLoads scaricherebbe decine di MB e sovrascriverebbe i dati locali.
# La porta 1 rifiuta subito la connessione: il refresh fallisce in millisecondi e non
# esce dalla macchina, cosa che serve anche perche' la suite gira con ./mvnw -o.
gtfs.static-props.url=http://127.0.0.1:1/rome_static_gtfs.zip
gtfs.realtime.trip-updates-url=http://127.0.0.1:1/trip_updates.pb
gtfs.realtime.vehicle-positions-url=http://127.0.0.1:1/vehicle_positions.pb
gtfs.realtime.service-alerts-url=http://127.0.0.1:1/service_alerts.pb
strikes.mit.rss-url=http://127.0.0.1:1/scioperi.rss

# I poll GTFS-RT partono dopo initialDelay = refresh-millis: alzandolo a un'ora
# non scattano mai per la durata di un test.
gtfs.realtime.refresh-millis=3600000

# Niente warm-up: non c'e' feed da scaldare e sono secondi di test in meno.
gtfs.index.warmup.enabled=false

# I tracker anti-spam di default scrivono in ${user.home}/.wemoveroma: i test non
# devono sporcare la home di chi li esegue.
notifications.state-file=target/test-data/alerts-last-seen.json
notifications.strikes.state-file=target/test-data/strikes-last-seen.json

# Nessuna push e nessun contatto con Firebase dai test.
fcm.enabled=false
fcm.credentials-path=
